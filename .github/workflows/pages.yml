name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install test dependencies
        run: |
          npm ci --prefix supabase
          npm ci --prefix neon
          npm ci --prefix neon/function

      - name: Run client and database tests
        run: |
          node --test tests/*.test.mjs scripts/*.test.mjs
          npm test --prefix supabase
          npm run test:db --prefix neon
          npm test --prefix neon/function

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site files
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying a failed deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: retry_deployment
        uses: actions/deploy-pages@v5
